# nginx site config for the production image (see Dockerfile).
# TLS and the public domain are handled upstream by Coolify's reverse proxy (Traefik);
# this server only listens on plain HTTP inside the container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve the precompressed .gz files produced at build time; compress anything else on the fly.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_types application/javascript text/css image/svg+xml application/wasm font/otf;

  # Hashed build assets (JS, CSS, WASM) never change under the same URL: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fonts are not content-hashed; cache for a week and revalidate after.
  location /fonts/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # index.html must always be revalidated so a new deploy is picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # No client-side router: unknown paths are real 404s.
  location / {
    try_files $uri $uri/ =404;
  }
}
